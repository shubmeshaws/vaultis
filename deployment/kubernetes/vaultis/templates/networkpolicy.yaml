{{- if .Values.networkPolicy.enabled }}
# Allow app pods to receive traffic only on port 3000 from ingress controller
# and to connect out only to PostgreSQL.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vaultis.app.fullname" . }}
  labels:
    {{- include "vaultis.app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vaultis.app.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 3000
          protocol: TCP
  egress:
    # Allow DNS resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow traffic to PostgreSQL
    - to:
        - podSelector:
            matchLabels:
              {{- include "vaultis.pg.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.postgresql.service.port }}
          protocol: TCP
    # Allow HTTPS egress (OAuth callbacks, external APIs)
    - ports:
        - port: 443
          protocol: TCP
---
# PostgreSQL: only accept traffic from app pods, deny everything else
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "vaultis.pg.fullname" . }}
  labels:
    {{- include "vaultis.pg.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "vaultis.pg.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "vaultis.app.selectorLabels" . | nindent 14 }}
      ports:
        - port: 5432
          protocol: TCP
  egress:
    # DNS only — PostgreSQL has no reason to call external services
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
{{- end }}
