apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vaultis.app.fullname" . }}
  labels:
    {{- include "vaultis.app.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.config.nodeEnv | quote }}
  ALLOWED_DOMAINS: {{ .Values.config.allowedDomains | quote }}
  NEXT_PUBLIC_ALLOWED_DOMAINS_MSG: {{ .Values.config.allowedDomainsMsg | quote }}
