{{- if and .Values.postgresql.enabled .Values.postgresql.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "vaultis.pg.fullname" . }}-backup
  labels:
    {{- include "vaultis.pg.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.postgresql.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "vaultis.pg.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
          containers:
            - name: pg-backup
              image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
              command:
                - sh
                - -c
                - |
                  set -e
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  BACKUP_FILE="/backups/vaultis_${TIMESTAMP}.sql.gz"
                  echo "[$(date)] Starting backup..."
                  PGPASSWORD="$POSTGRES_PASSWORD" pg_dump \
                    -h {{ include "vaultis.pg.fullname" . }} \
                    -U {{ .Values.postgresql.auth.username }} \
                    -d {{ .Values.postgresql.auth.database }} \
                    --no-owner --clean --if-exists | gzip > "${BACKUP_FILE}"
                  echo "[$(date)] Backup saved: ${BACKUP_FILE} ($(du -h ${BACKUP_FILE} | cut -f1))"
                  # Rotate: keep last N backups
                  ls -tp /backups/vaultis_*.sql.gz | tail -n +{{ add .Values.postgresql.backup.retention 1 }} | xargs -r rm --
                  echo "[$(date)] Rotation complete. Current backups:"
                  ls -lh /backups/vaultis_*.sql.gz
              env:
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "vaultis.pg.secretName" . }}
                      key: {{ .Values.postgresql.auth.secretPasswordKey }}
              volumeMounts:
                - name: backup-storage
                  mountPath: /backups
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: {{ include "vaultis.pg.fullname" . }}-backup
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "vaultis.pg.fullname" . }}-backup
  labels:
    {{- include "vaultis.pg.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.postgresql.backup.persistence.storageClass }}
  storageClassName: {{ .Values.postgresql.backup.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.postgresql.backup.persistence.size | quote }}
{{- end }}
