# Default values for vaultis.

replicaCount: 2

image:
  repository: ghcr.io/your-username/vaultis
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

nodeSelector: {}

tolerations: []

affinity: {}

# --- Secrets Management (AWS SSM) ---
externalSecrets:
  enabled: false
  # Region where your SSM parameters are stored
  region: "us-east-1"
  # IAM Role ARN for the ServiceAccount (IRSA)
  roleArn: ""
  # The ClusterSecretStore to use (if pre-created), otherwise we build a SecretStore
  store:
    create: true
    name: "aws-parameter-store"
  # List of secrets to fetch from SSM
  # key: The key in the K8s secret
  # name: The name of the parameter in AWS SSM
  data: []
    # - key: DATABASE_URL
    #   name: /vaultis/prod/DATABASE_URL
    # - key: NEXTAUTH_SECRET
    #   name: /vaultis/prod/NEXTAUTH_SECRET

# Name of an existing secret or the one created by ExternalSecrets
externalSecretName: "vaultis-secrets"

env:
  # --- Application Configuration (Safe to commit) ---
  NODE_ENV: "production"
  # NEXTAUTH_URL: "https://your-domain.com"
  ALLOWED_DOMAINS: "gmail.com,prismforce.ai"
  NEXT_PUBLIC_ALLOWED_DOMAINS_MSG: "Access denied. Only @gmail.com or @prismforce.ai domains are allowed."

  # --- Secrets (Do NOT commit values here) ---
  # These should be provided via the 'externalSecretName' or a SealedSecret.
  # If you must test locally, uncomment and set values, but do not push to git.
  # DATABASE_URL: ""
  # NEXTAUTH_SECRET: ""
  # GITHUB_ID: ""
  # GITHUB_SECRET: ""
  # GOOGLE_ID: ""
  # GOOGLE_SECRET: ""
