version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: queryflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: queryflow
      POSTGRES_PASSWORD: queryflow123
      POSTGRES_DB: queryflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queryflow"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
